<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>taskboard tab groups</title>
<style>
:root{color-scheme:light dark;font:14px/1.45 system-ui,sans-serif}
body{margin:1rem;min-width:22rem}
p{margin:0 0 .75rem}
form{display:flex;gap:.5rem;margin-bottom:.75rem}
input{flex:1;padding:.3rem .45rem}
ul{list-style:none;padding:0;margin:0 0 .75rem}
li{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.25rem 0}
#status{min-height:1.4em;opacity:.8}
</style>
</head>
<body>
<p>Links on taskboard pages at <code>http://127.0.0.1</code> and <code>http://localhost</code> (any port) open in tab groups already. Add any other address you open taskboard at, such as its HTTPS <code>tls_listen</code> address.</p>
<form id="add">
  <input id="origin" type="url" placeholder="e.g. https://devbox.lan:8443" required>
  <button type="submit">Add</button>
</form>
<ul id="origins"></ul>
<p id="status" role="status"></p>
<script src="options.js"></script>
</body>
</html>
